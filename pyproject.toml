[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-clock"
version = "1.0.2"
description = "The time in big digits on your RGB keyboard while you are away: Logitech G HUB, Windows Dynamic Lighting (Razer, Corsair, ASUS, SteelSeries, HyperX) and OpenRGB. Timer, Pomodoro, alarms, music, font editor, 6 languages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/Inter-OFL.txt"]
requires-python = ">=3.9"
authors = [{ name = "Ilyomix" }]
keywords = ["keyboard-clock", "rgb-keyboard", "logitech", "logitech-g", "g-hub", "razer", "corsair", "dynamic-lighting",
            "lamparray", "openrgb", "per-key-rgb", "clock", "pomodoro", "timer", "alarm", "led", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://ilyomix.github.io/keyboard-clock/"
Source = "https://github.com/Ilyomix/keyboard-clock"
Issues = "https://github.com/Ilyomix/keyboard-clock/issues"

[project.scripts]
keyboard-clock = "keyboard_clock:main"

[project.gui-scripts]
keyboard-clock-bg = "keyboard_clock:main"

[tool.setuptools]
py-modules = ["keyboard_clock"]
